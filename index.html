<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YousaTools - Free Online Tools</title>
    <meta
      name="description"
      content="YousaTools offers free, private, client-side online utilities. Compress JPEG, PNG, and WebP images instantly in your browser without uploading files to any server."
    />
    <meta name="keywords" content="image compressor, free online tools, compress jpeg, compress png, compress webp, client side image compression, browser utilities, yousatools" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YousaTools" />
    <meta property="og:title" content="YousaTools - Free Online Tools" />
    <meta
      property="og:description"
      content="Free, private, browser-based online tools. Compress images instantly in your browser with zero server uploads."
    />
    <meta property="og:url" content="https://yousatools.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YousaTools - Free Online Tools" />
    <meta
      name="twitter:description"
      content="Free, private, browser-based online tools. Compress images instantly in your browser with zero server uploads."
    />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org WebApplication Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "YousaTools",
        "url": "https://yousatools.com",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "All",
        "description": "Free online browser-based utilities including client-side image compression for JPEG, PNG, and WebP formats without server upload.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Client-side image compression",
          "Zero server file uploads for total privacy",
          "Customizable compression quality factor",
          "Direct original and compressed size comparisons",
          "Format conversion between PNG, JPEG, and WebP"
        ]
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900 min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
